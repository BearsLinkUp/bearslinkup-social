name: Generar semana Bears LinkUp

# Lunes 6:00 a.m. AST = 10:00 UTC. Puerto Rico no tiene horario de verano,
# asi que esta hora no se mueve nunca.
#
# Esta corrida hace TODO el trabajo creativo: escoge el tema del banco,
# genera las 8 fotos y los 3 clips con fal.ai, monta la capa de marca,
# arma el reel y deja semana/ listo. Despues, el workflow "Publicar" saca
# cada pieza a su hora. Nadie toca nada.
#
# Tres formas de arrancarla:
#   1. sola, los lunes por cron
#   2. a mano, con el boton "Run workflow" y sus campos
#   3. empujando un commit que toque disparo.json — los argumentos salen de
#      ese archivo. Asi se puede disparar sin pasar por la pagina de GitHub.
#
# Pase lo que pase, la corrida deja estado-corrida.md commiteado con el
# resultado y el log completo. Si algo revienta, ahi queda escrito.

on:
  schedule:
    - cron: '0 10 * * 1'
  push:
    paths:
      - 'disparo.json'
  workflow_dispatch:
    inputs:
      semana:
        description: 'Forzar una entrada del banco (w1, w2, w3, w4). Vacio = la que toque.'
        required: false
        default: ''
      solo_plan:
        description: 'Solo escribir semana.json, sin generar medios'
        type: boolean
        required: false
        default: false
      remontar:
        description: 'Re-montar la marca sobre las fotos ya generadas. GRATIS, no llama a fal.'
        type: boolean
        required: false
        default: false
      crudas_de:
        description: 'SHA de un commit del que traer semana/crudas antes de montar. Vacio = las que ya estan.'
        required: false
        default: ''
      solo:
        description: 'Regenerar solo estos dias (ej: mar,dom) y re-montar el resto. Vacio = la semana entera.'
        required: false
        default: ''

concurrency:
  group: generar-bearslinkup
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Los argumentos salen de los campos del boton, o de disparo.json cuando
      # la corrida viene de un push. Se resuelven aqui para que el resto de los
      # pasos lean una sola variable y no haya dos caminos que mantener.
      - name: Resolver argumentos
        id: args
        run: |
          set -e
          SEMANA="${{ github.event.inputs.semana }}"
          SOLO_PLAN="${{ github.event.inputs.solo_plan }}"
          REMONTAR="${{ github.event.inputs.remontar }}"
          CRUDAS_DE="${{ github.event.inputs.crudas_de }}"
          SOLO="${{ github.event.inputs.solo }}"

          if [ "${{ github.event_name }}" = "push" ] && [ -f disparo.json ]; then
            leer() { node -e "const d=require('./disparo.json');const v=d['$1'];process.stdout.write(v===undefined||v===null?'':String(v))"; }
            SEMANA=$(leer semana)
            SOLO_PLAN=$(leer solo_plan)
            REMONTAR=$(leer remontar)
            CRUDAS_DE=$(leer crudas_de)
            SOLO=$(leer solo)
            echo "Argumentos tomados de disparo.json"
          fi

          ARGS=""
          [ -n "$SEMANA" ] && ARGS="$ARGS --semana=$SEMANA"
          [ "$SOLO_PLAN" = "true" ] && ARGS="$ARGS --solo-plan"
          [ "$REMONTAR" = "true" ] && ARGS="$ARGS --remontar"
          [ -n "$SOLO" ] && ARGS="$ARGS --solo=$SOLO"

          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "crudas_de=$CRUDAS_DE" >> $GITHUB_OUTPUT
          echo "evento=${{ github.event_name }}" >> $GITHUB_OUTPUT
          echo "ARGS resueltos: '$ARGS'  crudas_de: '$CRUDAS_DE'"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Traer las crudas de otro commit
        if: ${{ steps.args.outputs.crudas_de != '' }}
        run: |
          set -e
          SHA="${{ steps.args.outputs.crudas_de }}"
          git fetch --depth=1 origin "$SHA" || git fetch --unshallow origin
          git checkout "$SHA" -- semana/crudas || git checkout FETCH_HEAD -- semana/crudas
          echo "Crudas traidas de $SHA:"
          ls -la semana/crudas

      # Fotos traidas de fuera. Sirve cuando la pieza se genero en otro
      # proveedor (ElevenLabs) y hay que montarla con la marca aqui, o cuando
      # una sola foto salio mal y no vale la pena repetir la semana entera.
      # Solo corre cuando el disparo viene de un push: el cron y el boton la
      # ignoran, para que un disparo.json viejo no se meta en una corrida sola.
      - name: Traer fotos por URL
        if: ${{ steps.args.outputs.evento == 'push' }}
        run: |
          set -e
          [ -f disparo.json ] || exit 0
          node -e "
            const d = require('./disparo.json');
            const f = d.fotos || {};
            for (const [k, v] of Object.entries(f)) {
              const url = typeof v === 'string' ? v : v.url;
              const recorte = (typeof v === 'object' && v.recorte) ? v.recorte : '';
              if (url) console.log([k, url, recorte].join('\t'));
            }
          " > fotos.txt
          if [ ! -s fotos.txt ]; then echo "disparo.json no trae fotos."; exit 0; fi
          mkdir -p semana/crudas
          while IFS=$'\t' read -r nombre url recorte; do
            [ -z "$nombre" ] && continue
            echo "· bajando $nombre"
            curl -fsSL "$url" -o cruda.bin < /dev/null
            if [ -n "$recorte" ]; then
              FILTRO="crop=$recorte,scale=1080:1350"
            else
              FILTRO="scale=1080:1350:force_original_aspect_ratio=increase,crop=1080:1350"
            fi
            ffmpeg -nostdin -v error -y -i cruda.bin -vf "$FILTRO" -q:v 2 "semana/crudas/$nombre.jpg"
            ls -l "semana/crudas/$nombre.jpg"
          done < fotos.txt
          rm -f cruda.bin fotos.txt

      # Lo mismo para los clips del reel. Se normalizan a 1080x1920 h264 para
      # que armarReel los pegue sin sorpresas.
      - name: Traer clips por URL
        if: ${{ steps.args.outputs.evento == 'push' }}
        run: |
          set -e
          [ -f disparo.json ] || exit 0
          node -e "
            const d = require('./disparo.json');
            const c = d.clips || {};
            for (const [k, v] of Object.entries(c)) {
              const url = typeof v === 'string' ? v : v.url;
              if (url) console.log([k, url].join('\t'));
            }
          " > clips.txt
          if [ ! -s clips.txt ]; then echo "disparo.json no trae clips."; exit 0; fi
          mkdir -p semana/crudas
          while IFS=$'\t' read -r nombre url; do
            [ -z "$nombre" ] && continue
            echo "· bajando $nombre"
            curl -fsSL "$url" -o clip.bin < /dev/null
            ffmpeg -nostdin -v error -y -i clip.bin \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
              -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart \
              "semana/crudas/$nombre.mp4"
            ls -l "semana/crudas/$nombre.mp4"
          done < clips.txt
          rm -f clip.bin clips.txt

      - name: Generar la semana
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          MODELO_IMAGEN: ${{ secrets.MODELO_IMAGEN }}
          MODELO_VIDEO: ${{ secrets.MODELO_VIDEO }}
        run: |
          set -o pipefail
          node generar.js ${{ steps.args.outputs.args }} 2>&1 | tee corrida.log

      - name: Guardar la semana en el repo
        run: |
          if [ -n "$(git status --porcelain semana/)" ]; then
            git config user.name "bearslinkup-publisher"
            git config user.email "admin@bearslinkup.com"
            git add -A semana/
            git commit -m "semana: $(date -u +%G-W%V)"
            git pull --rebase --autostash
            git push
          else
            echo "Sin cambios en semana/."
          fi

      # Deja por escrito como termino la corrida, pase lo que pase. Sin esto
      # hay que entrar a la pagina de Actions para saber por que fallo algo, y
      # eso no siempre se puede.
      - name: Dejar el estado escrito
        if: always()
        run: |
          git config user.name "bearslinkup-publisher"
          git config user.email "admin@bearslinkup.com"
          {
            echo "# Ultima corrida de generar"
            echo
            echo "- resultado: **${{ job.status }}**"
            echo "- corrida: ${{ github.run_number }} (id ${{ github.run_id }})"
            echo "- disparada por: ${{ github.event_name }}"
            echo "- terminada: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- argumentos: \`${{ steps.args.outputs.args }}\`"
            echo "- crudas_de: \`${{ steps.args.outputs.crudas_de }}\`"
            echo
            if [ -f semana/semana.json ]; then
              echo "## Semana en el repo"
              echo
              echo '```'
              node -e "const s=require('./semana/semana.json');console.log('banco: '+s.banco+' — '+(s.tema||''));s.piezas.forEach(p=>console.log('- '+p.dia+' · '+p.tipo+' · '+p.hora))" 2>&1 || true
              echo '```'
              echo
            fi
            echo "## Log"
            echo
            echo '```'
            if [ -f corrida.log ]; then cat corrida.log; else echo "(la corrida no llego a ejecutar generar.js)"; fi
            echo '```'
          } > estado-corrida.md
          git add estado-corrida.md
          git commit -m "estado: corrida ${{ github.run_number }} ${{ job.status }}" || echo "sin cambios en el estado"
          git pull --rebase --autostash || true
          git push || echo "no se pudo empujar el estado"

      - name: Resumen
        if: always()
        run: |
          echo "### Semana generada" >> $GITHUB_STEP_SUMMARY
          if [ -f semana/semana.json ]; then
            node -e "const s=require('./semana/semana.json');console.log('Banco: '+s.banco+' — '+(s.tema||''));s.piezas.forEach(p=>console.log('- '+p.dia+' · '+p.tipo+' · '+p.hora))" >> $GITHUB_STEP_SUMMARY
          else
            echo "No se genero semana.json." >> $GITHUB_STEP_SUMMARY
          fi
