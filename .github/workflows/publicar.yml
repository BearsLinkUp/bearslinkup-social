name: Publicar Bears LinkUp

# La hora de cada pieza NO vive aqui. Vive en semana/semana.json, en el campo
# "hora" de cada pieza (UTC). Puerto Rico es AST (UTC-4) todo el año — no hay
# horario de verano, asi que esas horas no se mueven nunca.
#   Lun 12:00 p.m. AST → 16:00 UTC   carrusel
#   Mar  6:00 a.m. AST → 10:00 UTC   imagen · diagnostico
#   Mie  7:00 p.m. AST → 23:00 UTC   reel
#   Vie 12:00 p.m. AST → 16:00 UTC   imagen · precio real
#   Dom  6:00 p.m. AST → 22:00 UTC   imagen · oportunidad
#
# POR QUE CORRE CADA HORA Y NO CINCO VECES POR SEMANA:
# el cron de GitHub no es puntual. Medido en este repo el 14 y 15 de septiembre
# de 2026, llego 4h10m tarde un dia y 4h40m el otro. Con cinco crones exactos y
# una ventana de tolerancia, el proceso despertaba cuando la ventana ya habia
# cerrado, no publicaba nada y salia en verde.
# Ahora despierta cada hora y el script decide: publica la pieza que ya vencio y
# sigue pendiente, sin importar cuanto se atrase el disparador, una por corrida.
# Si GitHub se salta una hora, la siguiente la agarra. En repo publico las
# corridas de Actions no cuestan.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dia:
        description: 'Forzar una pieza (lun, mar, mie, vie, dom). Vacío = la que toque ahora.'
        required: false
        default: ''
      dry:
        description: 'Simulacro: valida y no publica'
        type: boolean
        required: false
        default: false

concurrency:
  group: publicar-bearslinkup
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publicar
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.dia }}" ]; then ARGS="$ARGS --dia=${{ github.event.inputs.dia }}"; fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node publicar.js $ARGS

      - name: Anotar lo publicado
        if: always()
        run: |
          if ! git diff --quiet -- semana/semana.json; then
            git config user.name "bearslinkup-publisher"
            git config user.email "admin@bearslinkup.com"
            git add semana/semana.json
            git commit -m "publicado: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Sin cambios que anotar."
          fi
