name: Publicar Bears LinkUp

# La hora de cada pieza NO vive aqui. Vive en semana/semana.json, en el campo
# "hora" de cada pieza (UTC). Puerto Rico es AST (UTC-4) todo el año — no hay
# horario de verano, asi que esas horas no se mueven nunca.
#   Lun 12:00 p.m. AST → 16:00 UTC   carrusel
#   Mar  6:00 a.m. AST → 10:00 UTC   imagen · diagnostico
#   Mie  7:00 p.m. AST → 23:00 UTC   reel
#   Vie 12:00 p.m. AST → 16:00 UTC   imagen · precio real
#   Dom  6:00 p.m. AST → 22:00 UTC   imagen · oportunidad
#
# APAGADO EL 16/sep/2026 — LA PUBLICACION SE MUDO A METRICOOL.
#
# Este workflow YA NO PUBLICA SOLO. Se le quito el disparador automatico para
# que no choque con Metricool: dos sistemas publicando la misma pieza duplican
# el post en la cuenta del cliente, y eso es peor que un post tarde.
#
# El repo SIGUE VIVO Y HACE FALTA: Metricool no guarda los medios, se los baja
# por URL publica de raw.githubusercontent.com. Si se borra semana/, Metricool
# se queda sin de donde bajar los artes y los reels.
#
# Historial de por que se apago, para que nadie lo vuelva a encender sin saber:
# el cron de GitHub nunca fue puntual. Medido aqui mismo, llego 4h10m tarde el
# 14/sep y 4h40m el 15/sep. Puesto a correr cada hora, GitHub solo lo corrio
# 4 veces en 24 horas en vez de 24. Ninguna corrida programada llego a publicar.
#
# Queda workflow_dispatch para poder correrlo A MANO en una emergencia — por
# ejemplo si Metricool se cae y hay que sacar una pieza. Antes de usarlo,
# confirma en Metricool que esa pieza no esta programada.
#
#   PARA VOLVER A ENCENDERLO: descomenta el bloque schedule de abajo Y apaga
#   primero lo que este programado en Metricool. Nunca los dos a la vez.
#
# on:
#   schedule:
#     - cron: '0 * * * *'

on:
  workflow_dispatch:
    inputs:
      dia:
        description: 'Forzar una pieza (lun, mar, mie, vie, dom). Vacío = la que toque ahora.'
        required: false
        default: ''
      dry:
        description: 'Simulacro: valida y no publica'
        type: boolean
        required: false
        default: false

concurrency:
  group: publicar-bearslinkup
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publicar
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.dia }}" ]; then ARGS="$ARGS --dia=${{ github.event.inputs.dia }}"; fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node publicar.js $ARGS

      - name: Anotar lo publicado
        if: always()
        run: |
          if ! git diff --quiet -- semana/semana.json; then
            git config user.name "bearslinkup-publisher"
            git config user.email "admin@bearslinkup.com"
            git add semana/semana.json
            git commit -m "publicado: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Sin cambios que anotar."
          fi
